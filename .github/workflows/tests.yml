name: Tests

# The suite on every push to main and every pull request. It is an executable rather than an
# XCTest bundle, see docs/adr/0001-spm-only-toolchain.md, so there is nothing to install and
# nothing to configure: one script, and it fails loudly.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The app uses NSGlassEffectView behind an availability check, which still has to compile,
    # so the runner needs the macOS 26 SDK even for the tests.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Tests with coverage
        run: ./run-tests.sh --coverage
      # Warnings are worth failing on here rather than being read past locally: this is the one
      # place nobody is in a hurry.
      - name: Build without warnings
        run: |
          swift build 2>&1 | tee build.log
          if grep "warning:" build.log | grep -v "ld: warning: search path" | grep -q .; then
            echo "::error::the build produced warnings"
            exit 1
          fi
